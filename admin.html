<!DOCTYPE html>
<html lang="en">

<script>
    if (sessionStorage.getItem("role") !== "admin") {
        window.location.replace("index.html");
    }
</script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Admin</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

<div class="container">

    <nav class="navbar">
        <a href="index.html">Schedule</a>
        <a href="survey.html">Availability Survey</a>
        <a href="admin.html" class="active">Admin</a>
    </nav>

    <h1>Schedule Admin</h1>

    <div id="adminPanel">
        <div class="survey-container">
            <h2>Add Schedule Event</h2>
            <form id="scheduleForm">
                <div class="form-group">
                    <label>Day</label>
                    <select id="day">
                        <option>Monday</option>
                        <option>Tuesday</option>
                        <option>Wednesday</option>
                        <option>Thursday</option>
                        <option>Friday</option>
                        <option>Saturday</option>
                        <option>Sunday</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Category</label>

                    <select id="category">
                        <option>Practice</option>
                        <option>Meeting</option>
                        <option>Tournament</option>
                        <option>Scrimmage</option>
                        <option>Frisbee Friday</option>
                        <option>Chain Gang</option>
                        <option>Hang Out</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Start Time</label>
                    <input type="time" id="startTime">
                </div>

                <div class="form-group">
                    <label>End Time</label>
                    <input type="time" id="endTime">
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="location">
                </div>

                <div class="form-group">
                    <label>What to Bring</label>
                    <input type="text" id="whatToBring" placeholder="e.g., Cleats, Water Bottle, Disc">
                </div>

                <button type="submit">
                    Add Event
                </button>
            </form>
        </div>
        <br></br>
        <div class="survey-container">

            <h2>Current Events</h2>

            <div id="eventList"></div>
        </div>
    </div>
</div>

<!-- Templates -->
<template id="daySectionTemplate">
    <div class="daySection">
        <h3 class="dayHeader"></h3>
        <div class="dayEvents"></div>
    </div>
</template>

<template id="eventCardTemplate">
    <div class="eventCard">
        <div class="eventHeader">
            <div class="eventCategory"></div>
            <button class="deleteButton" title="Delete event">×</button>
        </div>
        
        <div class="eventTime">
            <svg class="timeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span></span>
        </div>

        <div class="eventLocation">
            <svg class="locationIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
            </svg>
            <span></span>
        </div>

        <div class="eventBring">
            <svg class="bringIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            <span></span>
        </div>
    </div>
</template>

<script type="module" src="js/admin.js"></script>

</body>

</html>
