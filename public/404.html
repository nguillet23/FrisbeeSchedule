<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Weekly Schedule</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side rewrites, so a deep-link refresh (e.g. /survey)
      // 404s. This encodes the real path into a query string and redirects to the SPA's
      // index.html, which decodes it back via the script in index.html's <head>.
      var pathSegmentsToKeep = 1 // keep '/FrisbeeSchedule'

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
