<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Availability Survey</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/survey.css">
</head>

<body>

<div class="container">

    <nav class="navbar">
        <a href="index.html">Schedule</a>
        <a href="survey.html" class="active">Availability Survey</a>
        <a href="admin.html">Admin</a>
    </nav>

    <h1>Availability Survey</h1>

    <div class="survey-layout">

        <form id="surveyForm" class="survey-form">

            <label for="name">Name:</label>
            <select id="name">
                <option value="">Loading...</option>
            </select>

            <h2>When are you available?</h2>

            <div id="availabilityContainer">

                <div class="availability">

                    <select class="day">
                        <option>Monday</option>
                        <option>Tuesday</option>
                        <option>Wednesday</option>
                        <option>Thursday</option>
                        <option>Friday</option>
                        <option>Saturday</option>
                        <option>Sunday</option>
                    </select>

                    <input type="time" class="startTime" min="10:00" max="22:00">

                    <input type="time" class="endTime" min="10:00" max="22:00">

                    <button type="button" class="removeTime">
                        Remove
                    </button>

                </div>

            </div>

            <br>

            <button type="button" id="addTime">
                Add another time
            </button>

            <button type="submit">
                Submit
            </button>

        </form>

        <aside class="schedule-preview-panel">
            <h2>Selected Person Schedule</h2>
            <p id="previewMemberName" class="preview-member-name">Choose a member to preview their availability.</p>
            <div id="memberSchedulePreview" class="member-schedule-preview"></div>
        </aside>

    </div>

</div>

<script type="module" src="js/survey.js"></script>

</body>
</html>
