<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Access</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="password-body">

<div class="container password-layout">
    <div class="password-card">
        <h1>Weekly Schedule</h1>
        <p class="password-subtitle">Enter the shared password to access the schedule.</p>

        <form id="sitePasswordForm" class="password-form">
            <div class="input-group">
                <input type="password" id="sitePassword" placeholder=" " required>
                <label>Password</label>
                <button type="button" id="togglePassword" class="toggle-password-btn">Show</button>
            </div>

            <button type="submit" class="login-button">Enter Website</button>
            <p id="passwordMessage" class="login-error"></p>
        </form>
    </div>
</div>

<script src="js/site-gate.js"></script>
<script type="module" src="js/password.js"></script>

</body>
</html>
