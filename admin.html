<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Admin</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

<div class="container">

    <nav class="navbar">
        <a href="index.html">Schedule</a>
        <a href="survey.html">Availability Survey</a>
        <a href="admin.html" class="active">Admin</a>
    </nav>

    <h1>Schedule Admin</h1>

    <div id="loginSection" class="admin-container">
        <div class="login-card">
            <h1>Admin Login</h1>
            <p>Sign in to manage the frisbee schedule</p>
            <div class="input-group">
                <input type="email" id="adminEmail" placeholder=" ">
                <label>Email</label>
            </div>
            <div class="input-group password-group">
                <input type="password" id="adminPassword" placeholder=" ">
                <label>Password</label>
                <button type="button" id="passwordToggle" class="password-toggle">
                    <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>
            <button id="loginButton" class="login-button">
                Login
            </button>
            <p id="loginMessage" class="login-error"></p>
        </div>
    </div>

    <div id="adminPanel" style="display:none;">
        <div class="survey-container">
            <button id="logoutButton">
                Logout
            </button>
            <h2>Add Schedule Event</h2>
            <form id="scheduleForm">
                <div class="form-group">
                    <label>Day</label>
                    <select id="day">
                        <option>Monday</option>
                        <option>Tuesday</option>
                        <option>Wednesday</option>
                        <option>Thursday</option>
                        <option>Friday</option>
                        <option>Saturday</option>
                        <option>Sunday</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Category</label>

                    <select id="category">
                        <option>Practice</option>
                        <option>Meeting</option>
                        <option>Tournament</option>
                        <option>Scrimmage</option>
                        <option>Frisbee Friday</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Start Time</label>
                    <input type="time" id="startTime">
                </div>

                <div class="form-group">
                    <label>End Time</label>
                    <input type="time" id="endTime">
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="location">
                </div>

                <div class="form-group">
                    <label>What to Bring</label>
                    <input type="text" id="whatToBring" placeholder="e.g., Cleats, Water Bottle, Disc">
                </div>

                <button type="submit">
                    Add Event
                </button>
            </form>
        </div>
        <br></br>
        <div class="survey-container">

            <h2>Current Events</h2>

            <div id="eventList"></div>
        </div>
    </div>
</div>

<script type="module" src="js/admin.js"></script>

</body>

</html>
