<!DOCTYPE html>
<html lang="en">

<script>
    if (sessionStorage.getItem("role") !== "admin") {
        window.location.replace("index.html");
    }
</script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Admin</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

<div class="container">

    <nav class="navbar">
        <a href="index.html">Schedule</a>
        <a href="survey.html">Availability Survey</a>
        <a href="admin.html" class="active">Admin</a>
    </nav>

    <h1>Schedule Admin</h1>

    <div id="adminPanel">
        <div class="survey-container">
            <h2>Add Schedule Event</h2>
            <form id="scheduleForm">
                <div class="form-group">
                    <label>Day</label>
                    <select id="day">
                        <option>Monday</option>
                        <option>Tuesday</option>
                        <option>Wednesday</option>
                        <option>Thursday</option>
                        <option>Friday</option>
                        <option>Saturday</option>
                        <option>Sunday</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Category</label>

                    <select id="category">
                        <option>Practice</option>
                        <option>Meeting</option>
                        <option>Tournament</option>
                        <option>Scrimmage</option>
                        <option>Frisbee Friday</option>
                        <option>Chain Gang</option>
                        <option>Hang Out</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Start Time</label>
                    <input type="time" id="startTime">
                </div>

                <div class="form-group">
                    <label>End Time</label>
                    <input type="time" id="endTime">
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="location">
                </div>

                <div class="form-group">
                    <label>What to Bring</label>
                    <input type="text" id="whatToBring" placeholder="e.g., Cleats, Water Bottle, Disc">
                </div>

                <button type="submit">
                    Add Event
                </button>
            </form>
        </div>
        <br></br>
        <div class="survey-container">

            <h2>Current Events</h2>

            <div id="eventList"></div>
        </div>
    </div>
</div>

<script type="module" src="js/admin.js"></script>

</body>

</html>
